<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Sweet Tooth</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="style.css" rel="stylesheet"/>
</head>
<body class="auth-body">
    <a href="index.html" class="back-home">
        <i class="fas fa-arrow-left"></i> Back to Home
    </a>

    <div class="register-container">
        <div class="register-left">
            <div class="register-icon">🧁</div>
            <h2>Join Sweet Tooth!</h2>
            <p>Create your account and start exploring our delicious collection of slice cakes and float drinks. Enjoy exclusive member benefits!</p>
        </div>

        <div class="register-right">
            <div class="register-header">
                <h3>Create Account</h3>
                <p>Fill in the details below to get started</p>
            </div>

            <!-- form register -->
              <form id="registerForm" novalidate>
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">First Name</label>
                            <input type="text" id="firstName" name="firstName" class="form-control" placeholder="John" autocomplete="off">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Last Name</label>
                            <input type="text" id="lastName" name="lastName" class="form-control" placeholder="Doe" autocomplete="off">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="text" id="registerEmail" name="registerEmail" class="form-control" placeholder="you@example.com" autocomplete="off">
                </div>

                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="text" id="registerPhone" name="registerPhone" class="form-control" placeholder="+62 812-3456-7890" autocomplete="off">
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <input type="password" id="registerPassword" name="registerPassword" class="form-control" placeholder="••••••••" onkeyup="checkPasswordStrength()" autocomplete="off">
                        <i class="fas fa-eye" onclick="togglePassword('registerPassword')"></i>
                    </div>
                    <div class="password-strength" id="passwordStrength">
                        <div class="password-strength-bar" id="strengthBar"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <div class="input-group">
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="••••••••" autocomplete="off">
                        <i class="fas fa-eye" onclick="togglePassword('confirmPassword')"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Date of Birth</label>
                    <input type="text" id="registerDob" name="registerDob" class="form-control" placeholder="YYYY-MM-DD (e.g. 2000-01-15)" autocomplete="off">
                </div>

                <div class="terms-agreement">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="terms">
                        <label class="form-check-label" for="terms">
                            I agree to the <a href="#">Terms & Conditions</a> and <a href="#">Privacy Policy</a>
                        </label>
                    </div>
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="newsletter">
                    <label class="form-check-label" for="newsletter">
                        Subscribe to our newsletter for exclusive offers
                    </label>
                </div>

                <button type="submit" class="btn-register">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>

                <div class="divider">
                    <span>OR</span>
                </div>

                <div class="social-register">
                    <button type="button" class="btn-social btn-google">
                        <i class="fab fa-google"></i> Google
                    </button>
                    <button type="button" class="btn-social btn-facebook">
                        <i class="fab fa-facebook-f"></i> Facebook
                    </button>
                </div>

                <div class="login-link">
                    Already have an account? <a href="login.html">Login here</a>
                </div>
            </form>
        </div>
    </div>

   <!-- jQuery & Custom JS --> 
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
